version = 1


# Default annotations for source files in this repository.
# Precedence "closest" means a file's own header, if it has one, wins over
# these defaults — so vendored third-party files keep their real attribution
# instead of being relabelled as ours.
[[annotations]]
path = [
  "soteria/**",
  "soteria-rust/**",
  "soteria-c/**",
  "soteria-linear/**",
  "packaging/**",
  "demo/**",
  "scripts/**",
  "*.opam",
  "*.opam.template",
  "dune-project",
  "dune",
  "README.md",
  "CHANGELOG.md",
  "RELEASING.md",
  "Makefile",
  ".github/**",
  ".vscode/**",
  ".claude/skills/**",
  ".gitignore",
  ".ocamlformat",
  ".ocamlformat-ignore",
  "NOTICE",              # Other files
  "THIRD_PARTY_NOTICES",
  "CONTRIBUTING.md",
  "shell.nix",
  "CLA.md",
  "CLAUDE.md",
  "AGENTS.md",
  "AI_POLICY.md",
]
precedence = "closest"
# Copyright is held jointly: Imperial College London for contributions made
# through 18 Dec 2025, Soteria Tools Ltd. from 19 Dec 2025 onward (see NOTICE).
SPDX-FileCopyrightText = ["2024-2025 Imperial College London", "2025-2026 Soteria Tools Ltd."]
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "soteria-rust/plugins/kani/**/*.rs"
precedence = "override"
SPDX-FileCopyrightText = "Kani Contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

[[annotations]]
path = "soteria-rust/plugins/kani_macros/**/*.rs"
precedence = "override"
SPDX-FileCopyrightText = "Kani Contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

[[annotations]]
path = "soteria-c/test/cram/cc.t/**/*.c"
precedence = "override"
SPDX-FileCopyrightText = "2013-2014 Srđan Panić <srdja.panic@gmail.com>"
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = "demo/aliasing.rs"
precedence = "override"
SPDX-FileCopyrightText = "2025 Neven Villani, Johannes Hostert, Derek Dreyer, and Ralf Jung"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
  "soteria-rust/test/cram/treeborrow.t/simple.rs",
  "soteria-rust/test/cram/treeborrow.t/simple-fail.rs",
  "soteria-rust/test/cram/treeborrow.t/raw-ptrs.rs",
  "soteria-rust/test/cram/treeborrow.t/offsets.rs",
]
precedence = "override"
SPDX-FileCopyrightText = "2025 Neven Villani, Johannes Hostert, Derek Dreyer, and Ralf Jung"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "demo/dll_test.rs"
precedence = "override"
SPDX-FileCopyrightText = "The Rust Project Developers (see https://thanks.rust-lang.org)"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "soteria-rust/test/cram/poly.t/linked_list.rs"
precedence = "override"
SPDX-FileCopyrightText = "Aria Desires"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "soteria-rust/test/cram/simple.t/split_merges.rs"
precedence = "override"
SPDX-FileCopyrightText = "The Rust Project Developers (see https://thanks.rust-lang.org)"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "soteria-rust/test/cram/simple.t/thread_local.rs"
precedence = "override"
SPDX-FileCopyrightText = "The Rust Project Developers (see https://thanks.rust-lang.org)"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
