[[annotations]]
path = "scripts/bench-index.html"
precedence = "override"
SPDX-FileCopyrightText = ["2019 rhysd", "2026 Soteria Tools Ltd."]
SPDX-License-Identifier = "MIT"

# Verbatim copies of the license texts of third-party components that Soteria
# links against or ships alongside. See THIRD_PARTY_NOTICES for the mapping from
# component to license text.
[[annotations]]
path = "third-party-licenses/**"
precedence = "override"
SPDX-FileCopyrightText = "The respective license stewards"
SPDX-License-Identifier = "LicenseRef-Third-Party-License-Text"

# Assets (images, vectors) — licensed under Apache-2.0 with the rest of the repo.
[[annotations]]
path = ["assets/*.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Soteria Tools Ltd."
SPDX-License-Identifier = "LicenseRef-Soteria-Logo"
